# Release (FEATURE-RELEASE-PIPELINE, DECISION-PUBLIC-NPM-RELEASE-ON-TAG): Cory publishes
# magic-spells to public npm from his machine (`npm publish -w packages/cli --access public`),
# then pushes the matching `v*` tag. On the tag this workflow checks the tag matches
# packages/cli, builds and tests, and installs the published version on each OS to prove
# the release is live. No publish step, no npm token in CI. Agents never tag or publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The tag matches packages/cli/package.json
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/cli version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack

  smoke:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the published version and run it
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The registry can take a moment to serve a new version.
          for attempt in 1 2 3 4 5 6; do
            if out=$(npx -y "magic-spells@$version" --version 2>&1); then break; fi
            echo "attempt $attempt: $out"; sleep 20
          done
          echo "$out"
          [ "$out" = "magic $version" ]
          npx -y "magic-spells@$version" --help

# CI (FEATURE-RELEASE-PIPELINE): build, type-check (sources and tests), test, and
# prove the packed tarball runs, on three OSes. Never publishes.
name: CI

on:
  push:
    branches: ['release/**', 'feat/**']
  pull_request:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Line endings differ on a Windows checkout; formatting is checked once.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack
